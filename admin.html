</style><style>
body{background:#f3f5f8}.admin{max-width:1040px;margin:3rem auto;padding:1rem}.panel{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:2rem;box-shadow:0 15px 50px #191a1810}.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}.admin input,.admin select{padding:.8rem 1rem;border:1px solid #ccd3dc;border-radius:10px;font:inherit}.admin button{border:0;border-radius:10px;padding:.8rem 1.2rem;background:#f3b93e;font-weight:800;cursor:pointer}.admin button.secondary{background:#191a18;color:white}iframe{width:100%;height:65vh;border:1px solid #d6dbe1;border-radius:14px}.notice{font-size:.9rem;color:#535556;margin:.8rem 0}#editor,#workspace{display:none}.login{max-width:450px;margin:12vh auto}.status{min-height:1.5em;color:#267044}.cms-editing{outline:2px dashed #f3b93e!important;outline-offset:2px;cursor:text}.cms-editing:focus{outline:2px solid #191a18!important;background:#fff8e6}
</style></head><body><main class="admin">
<section id="login" class="panel login"><img src="assets/yantratech-logo.png" alt="Yantratech Solutions" style="max-width:240px"><h1>Website Admin</h1><p class="notice">Sign in to edit the content shown across your website.</p><form id="login-form"><label for="password">Admin password</label><p><input id="password" type="password" required autocomplete="current-password" style="width:100%"></p><button>Sign in</button></form><p id="login-status" class="status" role="status"></p></section>
<section id="editor" class="panel"><div class="bar"><div><h1>Website content</h1><p class="notice">Choose a page, click “Edit page”, then select text in the preview. Click Save to publish your changes.</p></div><button id="logout" class="secondary">Sign out</button></div><div class="bar"><label>Page <select id="page"><option value="index.html">Home</option><option value="products.html">Products</option><option value="why-us.html">Why Us</option><option value="brands.html">Brands</option><option value="industries.html">Industries</option><option value="contact.html">Contact</option></select></label><div><button id="edit">Edit page</button> <button id="save" class="secondary">Save changes</button></div></div><p id="editor-status" class="status" role="status"></p><iframe id="preview" title="Website page preview"></iframe></section></main>
<script>
const $=s=>document.querySelector(s), api=(body)=>fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
async function check(){const r=await fetch('/api/admin?session=1',{cache:'no-store'});if(r.ok){$('#login').style.display='none';$('#editor').style.display='block';loadPage();}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const r=await api({action:'login',password:$('#password').value}),d=await r.json();$('#login-status').textContent=d.ok?'Signed in. Loading editor…':d.error;if(d.ok)check();});
function loadPage(){const name=$('#page').value;$('#preview').src=`/${name}?adminPreview=${Date.now()}`;$('#editor-status').textContent='';}
$('#page').addEventListener('change',loadPage);
$('#edit').onclick=()=>{const w=$('#preview').contentWindow;w.ytCmsEnableEdit();$('#editor-status').textContent='Click any highlighted heading, paragraph, link, or button text to edit it.';};
$('#save').onclick=async()=>{const w=$('#preview').contentWindow;const content=(await (await fetch('/api/admin?session=1',{cache:'no-store'})).json());content[$('#page').value]=w.ytCmsCollect();const r=await fetch('/api/admin',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});const d=await r.json();$('#editor-status').textContent=r.ok?'Saved. Your page now shows the updated content.':(d.error||'Could not save changes.');};
$('#logout').onclick=async()=>{await api({action:'logout'});location.reload();};check();
</script></body></html>
